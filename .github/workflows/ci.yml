name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://user:password@example.invalid/database?sslmode=require
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      ANTHROPIC_API_KEY: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (no regressions from main baseline)
        run: node scripts/lint-baseline.mjs

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Route tests
        run: pnpm test

      - name: Critical regression checks
        run: node scripts/critical-regression-check.mjs

      - name: MCP smoke test
        run: pnpm mcp:test

      - name: Production build
        run: pnpm build
