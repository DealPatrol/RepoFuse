<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" style="font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#080d12"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:0.04"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundedLeft">
      <rect x="30" y="30" width="400" height="460" rx="18"/>
    </clipPath>
    <clipPath id="roundedRight">
      <rect x="470" y="30" width="400" height="460" rx="18"/>
    </clipPath>
  </defs>

  <!-- Page background -->
  <rect width="900" height="520" fill="url(#bgGrad)"/>

  <!-- Subtle noise grid lines -->
  <line x1="0" y1="260" x2="900" y2="260" stroke="white" stroke-opacity="0.02" stroke-width="1"/>

  <!-- ─── LEFT PANEL — WITHOUT REPOFUSE ─── -->
  <rect x="30" y="30" width="400" height="460" rx="18" fill="#0d0d14" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>

  <!-- Label -->
  <text x="50" y="66" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#f97316" letter-spacing="3">WITHOUT REPOFUSE</text>

  <!-- Terminal window -->
  <rect x="50" y="78" width="360" height="170" rx="10" fill="#08080e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Window chrome -->
  <rect x="50" y="78" width="360" height="32" rx="10" fill="#111118"/>
  <rect x="50" y="96" width="360" height="14" fill="#111118"/>
  <circle cx="70" cy="94" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="86" cy="94" r="5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="102" cy="94" r="5" fill="#22c55e" fill-opacity="0.8"/>

  <!-- Terminal content -->
  <text x="66" y="126" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">$</text>
  <text x="78" y="126" font-family="'Courier New', monospace" font-size="11" fill="#d1d5db">git log --oneline</text>
  <text x="78" y="143" font-family="'Courier New', monospace" font-size="10" fill="#4b5563">a3f2c11  WIP: dashboard v2 (abandoned)</text>
  <text x="78" y="158" font-family="'Courier New', monospace" font-size="10" fill="#4b5563">b7d8e09  TODO: finish this someday</text>
  <text x="78" y="173" font-family="'Courier New', monospace" font-size="10" fill="#4b5563">c1a4d67  fix: auth bug (again)</text>
  <text x="66" y="192" font-family="'Courier New', monospace" font-size="11" fill="#6b7280">$</text>
  <text x="78" y="192" font-family="'Courier New', monospace" font-size="11" fill="#d1d5db">ls graveyard/</text>
  <text x="78" y="208" font-family="'Courier New', monospace" font-size="10" fill="#4b5563">half-built-saas/  abandoned-api/  ideas.txt</text>
  <text x="66" y="230" font-family="'Courier New', monospace" font-size="10.5" fill="#ef4444">ERROR: 3 repos collecting dust. No launches.</text>

  <!-- Pain points -->
  <text x="62" y="278" font-family="system-ui" font-size="15" fill="#6b7280">✕</text>
  <text x="80" y="278" font-family="system-ui" font-size="14" fill="#6b7280">Code sits forgotten in your repos</text>

  <text x="62" y="312" font-family="system-ui" font-size="15" fill="#6b7280">✕</text>
  <text x="80" y="312" font-family="system-ui" font-size="14" fill="#6b7280">App ideas are invisible without scanning</text>

  <text x="62" y="346" font-family="system-ui" font-size="15" fill="#6b7280">✕</text>
  <text x="80" y="346" font-family="system-ui" font-size="14" fill="#6b7280">Start from scratch on every new project</text>

  <text x="62" y="380" font-family="system-ui" font-size="15" fill="#ef4444" font-weight="700">✕</text>
  <text x="80" y="380" font-family="system-ui" font-size="14" fill="#f97316" font-weight="600">Good code dies. Nothing ships.</text>

  <!-- ─── ARROW ─── -->
  <g transform="translate(445, 260)">
    <line x1="0" y1="-22" x2="0" y2="14" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <polyline points="-8,-4 0,14 8,-4" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>
  </g>

  <!-- ─── RIGHT PANEL — WITH REPOFUSE ─── -->
  <rect x="470" y="30" width="400" height="460" rx="18" fill="url(#cyanGlow)" stroke="#22d3ee" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Label -->
  <text x="490" y="66" font-family="'Courier New', monospace" font-size="10" font-weight="700" fill="#22d3ee" letter-spacing="3" filter="url(#glow)">WITH REPOFUSE</text>

  <!-- Terminal window -->
  <rect x="490" y="78" width="360" height="170" rx="10" fill="#08080e" stroke="rgba(34,211,238,0.15)" stroke-width="1"/>
  <rect x="490" y="78" width="360" height="32" rx="10" fill="#0a1520"/>
  <rect x="490" y="96" width="360" height="14" fill="#0a1520"/>
  <circle cx="510" cy="94" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="526" cy="94" r="5" fill="#eab308" fill-opacity="0.8"/>
  <circle cx="542" cy="94" r="5" fill="#22c55e" fill-opacity="0.8"/>
  <!-- Online badge -->
  <circle cx="820" cy="94" r="4" fill="#22c55e" opacity="0.9"/>
  <text x="827" y="97" font-family="'Courier New', monospace" font-size="9" fill="#22c55e">Online</text>

  <!-- Terminal content -->
  <text x="506" y="126" font-family="'Courier New', monospace" font-size="11" fill="#22d3ee">✓</text>
  <text x="520" y="126" font-family="'Courier New', monospace" font-size="11" fill="#22c55e">RepoFuse scan complete — 14 repos</text>
  <text x="506" y="145" font-family="'Courier New', monospace" font-size="11" fill="#fb923c">⚡ 7 buildable apps detected</text>
  <text x="516" y="162" font-family="'Courier New', monospace" font-size="10" fill="#22d3ee">→ SaaS: AI Code Review Tool</text>
  <text x="516" y="178" font-family="'Courier New', monospace" font-size="10" fill="#22d3ee">→ Tool: Repo Health Dashboard</text>
  <text x="516" y="194" font-family="'Courier New', monospace" font-size="10" fill="#22d3ee">→ API: Webhook Automation Kit</text>
  <text x="516" y="210" font-family="'Courier New', monospace" font-size="10" fill="#4b5563">+ 4 more → full blueprints ready</text>
  <text x="506" y="230" font-family="'Courier New', monospace" font-size="10" fill="#22d3ee">▸ Generating MVP roadmaps...</text>

  <!-- Headline -->
  <text x="490" y="278" font-family="system-ui" font-size="17" font-weight="900" fill="white">Your graveyard becomes a</text>
  <text x="490" y="300" font-family="system-ui" font-size="17" font-weight="900" fill="#22d3ee">goldmine.</text>

  <!-- Benefits -->
  <text x="502" y="332" font-family="system-ui" font-size="14" fill="#22d3ee" font-weight="700">✓</text>
  <text x="520" y="332" font-family="system-ui" font-size="14" fill="#d1d5db">AI scans all repos, surfaces hidden ideas</text>

  <text x="502" y="361" font-family="system-ui" font-size="14" fill="#22d3ee" font-weight="700">✓</text>
  <text x="520" y="361" font-family="system-ui" font-size="14" fill="#d1d5db">Full blueprints, stack recs &amp; MVP roadmaps</text>

  <text x="502" y="390" font-family="system-ui" font-size="14" fill="#22d3ee" font-weight="700">✓</text>
  <text x="520" y="390" font-family="system-ui" font-size="14" fill="#d1d5db">Push a working scaffold to GitHub in 1 click</text>

  <text x="502" y="419" font-family="system-ui" font-size="14" fill="#22d3ee" font-weight="700">✓</text>
  <text x="520" y="419" font-family="system-ui" font-size="14" fill="#d1d5db">Auto-fix technical debt, launch previews</text>

  <!-- CTA hint -->
  <rect x="490" y="440" width="360" height="36" rx="10" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="1"/>
  <text x="670" y="463" font-family="system-ui" font-size="13" font-weight="700" fill="#22d3ee" text-anchor="middle">Scan My Repos Free →</text>
</svg>
